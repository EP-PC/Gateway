# Compose local: gateway + auth + account + product + db.
# Só o gateway publica porta; os demais ficam na rede interna.
# Antes de subir:
#   - "docker compose down" (sem -v) no Auth-service, Account-service e Product-service
#     (todos usam "name: store" e a porta 8080; o volume store_db-data é compartilhado)
#   - "mvn package" no Account-service, Auth-service, Product-service e aqui
#   - .env com JWT_SECRET_KEY e ACCOUNT_ADMIN_* (ver .env.example)
name: store

services:

  db:
    image: postgres:17
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-store}
      POSTGRES_DB: ${DB_NAME:-store}

  account:
    # imagem pedrohmm1/account ainda não está no Docker Hub
    build: ../Account-service
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-store}
      # seed do primeiro ADMIN (do .env local, fora do Git)
      ACCOUNT_ADMIN_EMAIL: ${ACCOUNT_ADMIN_EMAIL:?defina ACCOUNT_ADMIN_EMAIL no .env}
      ACCOUNT_ADMIN_HASH: ${ACCOUNT_ADMIN_HASH:?defina ACCOUNT_ADMIN_HASH no .env}
    depends_on:
      - db

  auth:
    # imagem pedrohmm1/auth ainda não está no Docker Hub
    build: ../Auth-service
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env}
      JWT_DURATION: ${JWT_DURATION:-3600000}
      JWT_HTTP_ONLY: ${JWT_HTTP_ONLY:-true}
    depends_on:
      - account

  product:
    # imagem pedrohmm1/product ainda não está no Docker Hub
    build: ../Product-service
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DB: ${DB_NAME:-store}
      DATABASE_USERNAME: ${DB_USER:-store}
      DATABASE_PASSWORD: ${DB_PASSWORD:-store}
    depends_on:
      - db

  gateway:
    build: .
    ports:
      - 8080:8080
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:8080}
    depends_on:
      - auth
      - account
      - product

volumes:
  db-data:
