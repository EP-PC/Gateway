spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:

          default-filters:
            # o cliente não pode forjar a identidade: só o gateway define id-account
            - RemoveRequestHeader=id-account
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:3000,http://localhost:8080}
                allowedHeaders: "*"
                allowedMethods: "*"
                allowCredentials: true

          routes:

            - id: auth-service
              uri: http://auth:8080
              predicates:
                - Path=/auth/**

            - id: account-service
              uri: http://account:8080
              predicates:
                - Path=/accounts/**

            - id: product-service
              uri: http://product:8080
              predicates:
                - Path=/products/**

            # PENDENTE: confirmar path com o dono do serviço
            - id: order-service
              uri: http://order:8080
              predicates:
                - Path=/orders/**

            # PENDENTE: confirmar path com o dono do serviço
            - id: exchange-service
              uri: http://exchange:8080
              predicates:
                - Path=/exchange/**

logging:
  level:
    root: info
    store: debug
    org.springframework.web: debug
